name: Build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build executable
        run: pyinstaller --noconfirm polar.spec

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: PolarH10Monitor-Windows
          path: dist/PolarH10Monitor/
          retention-days: 30

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build executable
        run: pyinstaller --noconfirm polar.spec

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: PolarH10Monitor-macOS
          path: dist/PolarH10Monitor/
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: PolarH10Monitor-Windows
          path: release/windows

      - name: Download macOS build
        uses: actions/download-artifact@v4
        with:
          name: PolarH10Monitor-macOS
          path: release/macos

      - name: Zip Windows package
        run: |
          cd release/windows
          zip -r ../../PolarH10Monitor-Windows.zip .

      - name: Zip macOS package
        run: |
          cd release/macos
          zip -r ../../PolarH10Monitor-macOS.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            PolarH10Monitor-Windows.zip
            PolarH10Monitor-macOS.zip
          generate_release_notes: true
